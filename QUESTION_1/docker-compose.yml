services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna
      POSTGRES_DB: annapurna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./masters.sql:/docker-entrypoint-initdb.d/masters.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annapurna -d annapurna"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  duckdb:
    image: duckdb/duckdb:latest
    entrypoint: ["duckdb"]
    command: ["-c", "SELECT 'DuckDB ready' AS status"]
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
